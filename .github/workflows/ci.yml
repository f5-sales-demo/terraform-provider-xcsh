# CI workflow for pull request validation
# Runs on all PRs and pushes to feature branches
# Replaces: lint.yml
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'refactor/**'
      - 'auto-generate/**'
      - 'auto-regenerate/**'
      - 'openapi-update'

# Least privilege: every job here only reads the repository. `statuses: write`
# and `checks: write` were granted workflow-wide but nothing consumed them —
# no job (nor the reusable _build-test.yml, whose GITHUB_TOKEN use is checkout
# plus a read of the public api-specs-enriched release asset) writes a commit
# status or a check run; job check runs are created by Actions itself, not
# through GITHUB_TOKEN. `contents: read` covers both. Grant anything more at the
# job level if a job ever needs it, rather than workflow-wide.
permissions:
  contents: read

# Cancel in-progress runs when new commits are pushed to the same PR/branch
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Build and Test
  # ═══════════════════════════════════════════════════════════════════════════
  build-test:
    name: Build and Test
    needs: [check-constitution]
    if: |
      always() &&
      !contains(needs.check-constitution.result, 'failure')
    uses: ./.github/workflows/_build-test.yml
    with:
      run-lint: true

  # ═══════════════════════════════════════════════════════════════════════════
  # Constitution Check - Prevents manual commits of generated files
  # ═══════════════════════════════════════════════════════════════════════════
  check-constitution:
    name: Constitution Check
    runs-on: ubuntu-latest
    # Skip for automated branches - they're expected to contain generated files
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'auto-generate/') &&
      !startsWith(github.head_ref, 'auto-regenerate/') &&
      github.head_ref != 'docs/auto-update' &&
      github.head_ref != 'openapi-update'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Spec Version Freshness (#1255)
        run: |
          bash scripts/check-spec-version-freshness.sh

      - name: Check for generated files (CLAUDE.md Rule 1)
        env:
          # Passed via env, never expanded straight into the script: a template
          # expansion inside run: is a code-injection sink (zizmor
          # template-injection). Shell-quoted at each use below.
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Checking PR for generated files..."

          # Get list of added/modified files (deletions are fine — orphan cleanup)
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD")

          # Check if generator tools are modified - this allows docs/examples changes
          #
          # The Makefile and this workflow are included because they define HOW
          # generation runs and how it is verified — `make generate`,
          # `verify-generate`, and the Validate Docs Generation step. A PR that
          # changes those legitimately carries the regenerated output, which is the
          # same reason a generator change does.
          #
          # #1397 was the case that exposed the gap: `docs/` and `examples/` had
          # drifted from the generators by 91 and 143 files, publishing HCL that
          # Terraform rejects (`JavaScript_challenge` for `javascript_challenge`) and
          # YAML that Actions rejects (`runs-on: Ubuntu-latest`). Fixing that meant
          # committing a catch-up regeneration alongside a CI assertion and a Makefile
          # change — and no generator changed, because the generators were already
          # right. The check had no category for that and blocked the fix.
          GENERATOR_TOOLS_MODIFIED=false
          # tools/pkg/codegen/ is where the resource, data-source and example templates
          # actually live, so a change there regenerates internal/provider/*_resource.go
          # by definition. It was missing from this list, which meant the one edit that
          # most obviously justifies regenerated output — editing the template — was the
          # one the check refused to accept (#1398 hit exactly that).
          if echo "$CHANGED_FILES" | grep -qE "^tools/transform-docs\.go$|^tools/(generate|normalize)-|^tools/pkg/(codegen|description|docfmt)/|^templates/|^Makefile$|^\.github/workflows/ci\.yml$"; then
            echo "Generator tools modified - docs/examples changes are allowed"
            GENERATOR_TOOLS_MODIFIED=true
          fi

          # Check if module path changed (rename scenario) - allows generated Go files
          # Only when the module directive itself changed (not just dependency updates)
          MODULE_RENAMED=false
          OLD_MODULE=""
          NEW_MODULE=""
          if echo "$CHANGED_FILES" | grep -qE "^go\.mod$"; then
            OLD_MODULE=$(git show "origin/${BASE_REF}:go.mod" 2>/dev/null | grep '^module ' | awk '{print $2}')
            NEW_MODULE=$(grep '^module ' go.mod | awk '{print $2}')
            if [ -n "$OLD_MODULE" ] && [ -n "$NEW_MODULE" ] && [ "$OLD_MODULE" != "$NEW_MODULE" ]; then
              echo "Module path renamed: $OLD_MODULE -> $NEW_MODULE"
              MODULE_RENAMED=true
            fi
          fi

          # Define patterns for generated files
          # IMPORTANT: These files are ALWAYS generated by CI/CD, NEVER committed manually
          # If there's a bug in generated code, fix the generator (tools/generate-all-schemas.go)
          GENERATED_PATTERNS=(
            # Provider documentation - generated by tfplugindocs + transform-docs.go
            "^docs/resources/.*\.md$"
            "^docs/data-sources/.*\.md$"
            "^docs/functions/.*\.md$"
            "^docs/guides/.*\.md$"
            # Example Terraform files - generated by generate-examples.go
            # (Note: examples/functions/ is manually maintained as source for docs)
            # (Note: examples/guides/ is manually maintained as source for guide docs)
            "^examples/resources/.*\.tf$"
            "^examples/data-sources/.*\.tf$"
            # Provider Go code - generated by generate-all-schemas.go
            # See MANUALLY_MAINTAINED_FILES for exceptions (utility data sources not from OpenAPI)
            "^internal/provider/.*_resource\.go$"
            "^internal/provider/.*_data_source\.go$"
          )

          # Manually maintained files that are EXCEPTIONS to the generated patterns
          # These data sources provide utility functionality not available in F5 OpenAPI specs
          MANUALLY_MAINTAINED_FILES=(
            "internal/provider/functions_registration.go"
            "internal/provider/addon_service_data_source.go"
            "internal/provider/addon_service_activation_status_data_source.go"
            "internal/provider/site_registration_data_source.go"
            "examples/data-sources/addon_service/data-source.tf"
            "examples/data-sources/addon_service_activation_status/data-source.tf"
            "examples/data-sources/site_registration/data-source.tf"
            # MkDocs documentation site index files (navigation, not provider docs)
            "docs/resources/index.md"
            "docs/data-sources/index.md"
            "docs/functions/index.md"
            "docs/guides/index.md"
          )

          # Patterns allowed when generator tools are modified
          ALLOWED_WITH_GENERATORS=(
            "^docs/resources/.*\.md$"
            "^docs/data-sources/.*\.md$"
            "^docs/functions/.*\.md$"
            "^docs/guides/.*\.md$"
            "^docs/index\.md$"
            "^examples/resources/.*\.tf$"
            "^examples/data-sources/.*\.tf$"
            "^internal/provider/.*_resource\.go$"
            "^internal/provider/.*_data_source\.go$"
          )

          # Helper function to check if file is manually maintained
          is_manually_maintained() {
            local file="$1"
            for maintained_file in "${MANUALLY_MAINTAINED_FILES[@]}"; do
              if [ "$file" = "$maintained_file" ]; then
                return 0  # true
              fi
            done
            return 1  # false
          }

          # Check for violations
          VIOLATIONS=""
          for file in $CHANGED_FILES; do
            # Skip manually maintained files
            if is_manually_maintained "$file"; then
              continue
            fi
            for pattern in "${GENERATED_PATTERNS[@]}"; do
              if echo "$file" | grep -qE "$pattern"; then
                # If generator tools are modified, check if this pattern is allowed
                if [ "$GENERATOR_TOOLS_MODIFIED" = true ]; then
                  ALLOWED=false
                  for allowed_pattern in "${ALLOWED_WITH_GENERATORS[@]}"; do
                    if echo "$file" | grep -qE "$allowed_pattern"; then
                      ALLOWED=true
                      break
                    fi
                  done
                  if [ "$ALLOWED" = true ]; then
                    continue
                  fi
                fi
                # Module rename: allow generated .go files only if their diff
                # contains the old→new import path substitution
                if [ "$MODULE_RENAMED" = true ] && echo "$file" | grep -qE "\.go$"; then
                  CHANGED_LINES=$(git diff "origin/${BASE_REF}" -- "$file" 2>/dev/null | grep -E '^[+-]' | grep -v '^[+-][+-][+-]')
                  if echo "$CHANGED_LINES" | grep -qF "\"$OLD_MODULE" && echo "$CHANGED_LINES" | grep -qF "\"$NEW_MODULE"; then
                    continue
                  fi
                fi
                VIOLATIONS="$VIOLATIONS\n  - $file"
                break
              fi
            done
          done

          # Report results
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::PR contains generated files"
            echo "-----------------------------------------------------"
            echo -e "$VIOLATIONS"
            echo "-----------------------------------------------------"
            echo ""
            echo "CLAUDE.md Rule 1: Never Commit Generated Files"
            echo ""
            echo "These files are generated by CI/CD workflows."
            echo ""
            echo "If you need to fix a bug in generated resource code:"
            echo "  1. Fix the generator: tools/generate-all-schemas.go"
            echo "  2. Commit ONLY the generator changes"
            echo "  3. CI/CD will automatically regenerate all resources"
            echo ""
            echo "Note: docs/ and examples/ changes are allowed when"
            echo "generator tools (tools/*.go, templates/) are also"
            echo "modified in the same PR."
            exit 1
          fi

          echo "No generated files detected in PR"

  # ═══════════════════════════════════════════════════════════════════════════
  # Validate documentation will regenerate correctly (for PRs with tool changes)
  # ═══════════════════════════════════════════════════════════════════════════
  validate-docs-generation:
    name: Validate Docs Generation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if docs regeneration needed
        id: check
        env:
          # See the note on BASE_REF above: never expand a template into run:.
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD")

          # Every executable, dependency, version pin, and configuration input
          # to scripts/generate-provider-docs.sh must activate this gate.
          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(internal/|tools/|templates/|scripts/generate-provider-docs\.sh$|\.terraform-version$|go\.(mod|sum)$|\.tfplugindocs(\.yml|\.yaml)?$|tfplugindocs\.(yml|yaml)$)'; then
            echo "needs_validation=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_validation=false" >> "$GITHUB_OUTPUT"
          fi

      # transform-docs.go enriches every page from this bundle. Without it the job
      # regenerated stripped-down docs and then diffed them against the correct
      # committed ones, so the assertion added in #1415 failed on its own PR. The
      # assertion was right; the job was missing an input.
      - name: Download API specs
        if: steps.check.outputs.needs_validation == 'true'
        uses: ./.github/actions/download-api-specs
        with:
          token: ${{ github.token }}

      - name: Set up Go
        if: steps.check.outputs.needs_validation == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Terraform
        if: steps.check.outputs.needs_validation == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install tfplugindocs
        if: steps.check.outputs.needs_validation == 'true'
        run: |
          # Retry logic for go install (network-dependent)
          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::Install tfplugindocs - Attempt $attempt of $max_attempts"
            if GOTOOLCHAIN=auto go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max_attempts" ]; then
              sleep_time=$((2 ** attempt * 5))
              echo "::warning::go install failed, retrying in ${sleep_time}s..."
              sleep "$sleep_time"
            fi
          done
          if [ "$attempt" -gt "$max_attempts" ]; then
            echo "::error::Failed to install tfplugindocs after $max_attempts attempts"
            exit 1
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Validate docs generation
        if: steps.check.outputs.needs_validation == 'true'
        run: |
          scripts/generate-provider-docs.sh
          if [ -n "$(git status --porcelain docs/ examples/ templates/)" ]; then
            echo "::error::Generated docs/examples differ from what is committed."
            echo "Run: scripts/generate-provider-docs.sh"
            echo "then commit the result. Files that differ:"
            git status --porcelain docs/ examples/ templates/
            echo "::group::Diff"
            git --no-pager diff -- docs/ examples/ templates/
            echo "::endgroup::"
            exit 1
          fi

          echo "Documentation generation validated successfully"

  # ═══════════════════════════════════════════════════════════════════════════
  # Validate Mock Fixtures (Issue #327)
  # Ensures generated mock defaults are in sync with api-defaults.json
  # ═══════════════════════════════════════════════════════════════════════════
  validate-mock-fixtures:
    name: Validate Mock Fixtures
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check if mock fixture regeneration needed
        id: check
        env:
          # See the note on BASE_REF above: never expand a template into run:.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Check if files that affect mock generation changed
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || echo "")

          if echo "$CHANGED_FILES" | grep -qE "^tools/api-defaults\.json$|^tools/generate-mock-fixtures\.go$|^internal/mocks/generated_defaults"; then
            echo "needs_validation=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_validation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.check.outputs.needs_validation == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Validate mock fixtures are in sync
        if: steps.check.outputs.needs_validation == 'true'
        run: |
          echo "::group::Regenerating mock fixtures"

          # Check if api-defaults.json exists
          if [ ! -f "tools/api-defaults.json" ]; then
            echo "tools/api-defaults.json not found - skipping validation"
            exit 0
          fi

          # Save current state
          cp internal/mocks/generated_defaults.go /tmp/generated_defaults.go.before

          # Regenerate
          go run tools/generate-mock-fixtures.go
          gofmt -s -w internal/mocks/generated_defaults.go

          echo "::endgroup::"

          # Compare
          if ! diff -q internal/mocks/generated_defaults.go /tmp/generated_defaults.go.before > /dev/null 2>&1; then
            echo "::error::Mock fixtures are out of sync with api-defaults.json"
            echo ""
            echo "The generated_defaults.go file does not match what would be"
            echo "generated from the current api-defaults.json."
            echo ""
            echo "To fix:"
            echo "  1. Run: go run tools/generate-mock-fixtures.go"
            echo "  2. Commit the updated internal/mocks/generated_defaults.go"
            echo ""
            echo "Diff:"
            diff internal/mocks/generated_defaults.go /tmp/generated_defaults.go.before || true
            exit 1
          fi

          echo "Mock fixtures are in sync with api-defaults.json"

      - name: Run mock tests
        if: steps.check.outputs.needs_validation == 'true'
        run: |
          echo "::group::Running mock tests"
          go test -v ./internal/mocks/...
          echo "::endgroup::"

  # ═══════════════════════════════════════════════════════════════════════════
  # Validate Shell Scripts (mirrors pre-commit shellcheck)
  # ═══════════════════════════════════════════════════════════════════════════
  validate-shell-scripts:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if shell script validation needed
        id: check
        env:
          # See the note on BASE_REF above: never expand a template into run:.
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || echo "")

          # Check if any shell scripts changed
          if echo "$CHANGED_FILES" | grep -qE "\.sh$"; then
            echo "needs_validation=true" >> "$GITHUB_OUTPUT"
            echo "Shell scripts changed - validation needed"
          else
            echo "needs_validation=false" >> "$GITHUB_OUTPUT"
            echo "No shell script changes - skipping validation"
          fi

      - name: Install shellcheck
        if: steps.check.outputs.needs_validation == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        if: steps.check.outputs.needs_validation == 'true'
        run: |
          echo "Running shellcheck on all shell scripts..."
          find . -name "*.sh" -type f -print0 | xargs -0 shellcheck --severity=warning
          echo "Shell script validation completed successfully"

  # ═══════════════════════════════════════════════════════════════════════════
  # Validate Terraform Examples (mirrors pre-commit terraform_fmt)
  # ═══════════════════════════════════════════════════════════════════════════
  validate-terraform-examples:
    name: Validate Terraform Examples
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if Terraform validation needed
        id: check
        env:
          # See the note on BASE_REF above: never expand a template into run:.
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || echo "")

          # Check if any Terraform files in examples/ changed
          if echo "$CHANGED_FILES" | grep -qE "^examples/.*\.tf$"; then
            echo "needs_validation=true" >> "$GITHUB_OUTPUT"
            echo "Terraform example files changed - validation needed"
          else
            echo "needs_validation=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform example changes - skipping validation"
          fi

      - name: Setup Terraform
        if: steps.check.outputs.needs_validation == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: steps.check.outputs.needs_validation == 'true'
        run: |
          echo "Checking Terraform formatting in examples/..."
          terraform fmt -check -diff -recursive examples/
          echo "Terraform formatting validated successfully"
