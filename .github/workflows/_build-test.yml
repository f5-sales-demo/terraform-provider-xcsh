# Reusable workflow for building and testing Go code
# Called by: on-merge.yml, ci.yml, sync-openapi.yml
name: Build and Test

on:
  workflow_call:
    inputs:
      go-version-file:
        description: 'Path to go.mod file for version detection'
        type: string
        default: 'go.mod'
      ref:
        description: 'Git ref to checkout'
        type: string
        default: ''
      run-lint:
        description: 'Whether to run golangci-lint'
        type: boolean
        default: false
    outputs:
      success:
        description: 'Whether build and tests passed'
        value: ${{ jobs.build.outputs.success }}

# Reusable workflows must not inherit the caller's token wholesale. Each job
# below opts into only the repository read needed for checkout and local actions.
permissions: {}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout plus the repository-local download action
    outputs:
      success: ${{ steps.result.outputs.success }}
    env:
      # Gitignored working location for the released API spec bundle — the same
      # path tools/generate-all-schemas.go defaults to.
      SPEC_DIR: docs/specifications/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate delivery state and append-only ledgers
        env:
          BASE_REF: ${{ github.base_ref }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$BASE_REF" ]; then
            ARGS+=(--base-ref "origin/${BASE_REF}")
          fi
          scripts/validate-provider-delivery-state.sh "${ARGS[@]}"

      - name: Download API specs
        # Tests in ./tools/... read the released spec bundle. This job is the only
        # place they run BEFORE merge: the _generate-provider.yml download runs
        # post-merge (on-merge.yml triggers on push: main), so a spec-dependent
        # failure would otherwise only surface on the way to a release.
        #
        # This used to be justified by TestCodespellCorrectionsDoNotCollideWithSpec-
        # PropertyNames (#1257), which guarded the blind post-generation spelling
        # rewrite. That rewrite, its correction map and the guard are gone — the
        # rewrite was the defect, not an unguarded version of it.
        #
        # f5-sales-demo/api-specs-enriched is public, so github.token with the
        # inherited contents: read is sufficient — no extra permission needed.
        uses: ./.github/actions/download-api-specs
        with:
          token: ${{ github.token }}
          spec-dir: ${{ env.SPEC_DIR }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Run go mod tidy
        run: |
          scripts/go-retry.sh 3 go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        # EVERY package, not just the root one (#1351). `go build .` compiles
        # main.go and whatever it transitively imports, which leaves the
        # hand-written internal/acctest package — imported only by tests —
        # uncompiled. main was left broken for exactly that reason: upstream
        # removed the apm* schemas, codegen dropped the GetAPM/DeleteAPM client
        # methods, and the hand-written acctest registry kept calling them while
        # a green "Build" step said nothing.
        run: scripts/go-retry.sh 3 go build -v ./...

      - name: Vet
        # go build ignores _test.go files; go vet type-checks them too, so this
        # is the step that notices a test file referencing a symbol codegen no
        # longer emits (#1351).
        run: scripts/go-retry.sh 3 go vet ./...

      - name: Vet build-ignored generators
        # tools/*.go carry `//go:build ignore`, which hides them from ./...
        # entirely. They are hand-written consumers of generated symbols, so they
        # need the same type check (#1351).
        run: scripts/vet-build-ignored-tools.sh

      - name: Test
        # XCSH_SPEC_DIR is deliberately always set: the #1257 guard hard-fails on
        # a set-but-unusable path, so a broken download can never masquerade as a
        # clean run.
        env:
          XCSH_SPEC_DIR: ${{ env.SPEC_DIR }}
        run: scripts/go-retry.sh 2 go test -v -race ./internal/... ./tools/...

      - name: Set result
        id: result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" == "success" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: inputs.run-lint
    permissions:
      contents: read # checkout the source being linted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Install golangci-lint
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < .golangci-version)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::.golangci-version must contain an exact semantic version"
            exit 1
          }
          GOTOOLCHAIN=auto go install \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        env:
          GOGC: "20"
        run: |
          # Lint hand-written code only. The generated internal/provider and
          # internal/client packages (// Code generated ... DO NOT EDIT, ~400k
          # lines) OOM the whole-program linters (unused/staticcheck) at default
          # concurrency — exit 143 — which was skipping the on-merge regeneration
          # cascade. Excluding them as targets, plus GOGC=20 and serial
          # concurrency, keeps peak memory bounded.
          # Use directories ({{.Dir}}), not import paths — golangci-lint expects paths.
          # Read into an array so each dir is a separate quoted arg (shellcheck-clean).
          mapfile -t pkgs < <(go list -f '{{.Dir}}' ./internal/... . ./tools/... | grep -vE '/internal/(provider|client)$')
          golangci-lint run --timeout=15m --concurrency=1 "${pkgs[@]}"
