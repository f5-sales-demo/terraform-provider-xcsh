# Reusable workflow for the complete provider build and test gate.
# Called by: on-merge.yml and ci.yml
name: Build and Test

on:
  workflow_call:
    inputs:
      go-version-file:
        description: Path to go.mod used to verify the Go version
        type: string
        default: go.mod
      ref:
        description: Immutable Git ref to check out
        type: string
        default: ''
      run-lint:
        description: Whether to run golangci-lint
        type: boolean
        default: false
      runner-label:
        description: Trusted runner label for heavy Go work
        type: string
        default: terraform-provider-xcsh-compute
      go-concurrency:
        description: Go package and process concurrency on the compute pool
        type: number
        default: 4
    outputs:
      success:
        description: Whether every required shard passed
        value: ${{ jobs.aggregate.outputs.success }}

permissions: {}

jobs:
  build:
    name: Build
    # The input is an asserted interface, while the route stays closed over the
    # one governed label so a caller cannot select arbitrary self-hosted capacity.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'terraform-provider-xcsh-compute' }}
    permissions:
      contents: read
    env:
      GOGC: '20'
      GOMEMLIMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '4GiB' || '16GiB' }}
      GOMAXPROCS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
      GO_PACKAGE_PARALLELISM: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify governed runner input
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          RUNNER_LABEL: ${{ inputs.runner-label }}
        run: test "$RUNNER_LABEL" = terraform-provider-xcsh-compute
      - name: Set up Go for fork isolation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false
      - name: Verify Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.25.13
      - name: Restore source-bound Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: provider-go-${{ runner.os }}-${{ runner.arch }}-1.25.13-${{ hashFiles('go.sum') }}
      - name: Validate shell scripts in the existing hosted fork shard
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHELLCHECK_VERSION: v0.11.0
        run: |
          archive="${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${archive}" | sha256sum --check -
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version | grep -Fx 'version: 0.11.0'
          find . -name "*.sh" -type f -print0 | xargs -0 "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --severity=warning
          scripts/test-github-api-download.sh
          scripts/test-classify-spec-release-semantics.sh
      - name: Validate delivery state and append-only ledgers
        env:
          BASE_REF: ${{ github.base_ref }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$BASE_REF" ]; then
            ARGS+=(--base-ref "origin/${BASE_REF}")
          fi
          scripts/validate-provider-delivery-state.sh "${ARGS[@]}"
      - name: Verify module graph is tidy
        run: |
          scripts/go-retry.sh 3 go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Build every package with runner profiling
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/provider-profile/build.json"
          mkdir -p "$(dirname "$profile")"
          if command -v runner-profile >/dev/null 2>&1; then
            command=(scripts/go-retry.sh 3 go build -p "$GO_PACKAGE_PARALLELISM" -v ./...)
            runner-profile --name build --output "$profile" --variant "p${GO_PACKAGE_PARALLELISM}" -- "${command[@]}"
          else
            scripts/go-retry.sh 3 go build -p "$GO_PACKAGE_PARALLELISM" -v ./...
          fi
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-ci-profile-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: ${{ runner.temp }}/provider-profile
          if-no-files-found: ignore
          retention-days: 30

  vet:
    name: Vet
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'terraform-provider-xcsh-compute' }}
    permissions:
      contents: read
    env:
      GOGC: '20'
      GOMEMLIMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '4GiB' || '16GiB' }}
      GOMAXPROCS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
      GO_PACKAGE_PARALLELISM: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Verify governed runner input
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          RUNNER_LABEL: ${{ inputs.runner-label }}
        run: test "$RUNNER_LABEL" = terraform-provider-xcsh-compute
      - name: Set up Go for fork isolation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false
      - name: Verify Go toolchain
        run: test "$(go env GOVERSION)" = go1.25.13
      - name: Restore source-bound Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: provider-go-${{ runner.os }}-${{ runner.arch }}-1.25.13-${{ hashFiles('go.sum') }}
      - name: Vet every package with runner profiling
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/provider-profile/vet.json"
          mkdir -p "$(dirname "$profile")"
          if command -v runner-profile >/dev/null 2>&1; then
            command=(scripts/go-retry.sh 3 go vet -p "$GO_PACKAGE_PARALLELISM" ./...)
            runner-profile --name vet --output "$profile" --variant "p${GO_PACKAGE_PARALLELISM}" -- "${command[@]}"
          else
            scripts/go-retry.sh 3 go vet -p "$GO_PACKAGE_PARALLELISM" ./...
          fi
          scripts/vet-build-ignored-tools.sh
      - name: Upload vet profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-ci-profile-${{ github.run_id }}-${{ github.run_attempt }}-vet
          path: ${{ runner.temp }}/provider-profile
          if-no-files-found: ignore
          retention-days: 30

  race:
    name: Race Tests
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'terraform-provider-xcsh-compute' }}
    permissions:
      contents: read
    env:
      GOGC: '20'
      GOMEMLIMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '4GiB' || '16GiB' }}
      GOMAXPROCS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
      GO_PACKAGE_PARALLELISM: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
      SPEC_DIR: docs/specifications/api
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Verify governed runner input
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          RUNNER_LABEL: ${{ inputs.runner-label }}
        run: test "$RUNNER_LABEL" = terraform-provider-xcsh-compute
      - name: Download API specs
        uses: ./.github/actions/download-api-specs
        with:
          token: ${{ github.token }}
          spec-dir: ${{ env.SPEC_DIR }}
      - name: Set up Go for fork isolation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false
      - name: Verify Go toolchain
        run: test "$(go env GOVERSION)" = go1.25.13
      - name: Restore source-bound Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: provider-go-${{ runner.os }}-${{ runner.arch }}-1.25.13-${{ hashFiles('go.sum') }}
      - name: Run race tests with runner profiling
        env:
          XCSH_SPEC_DIR: ${{ env.SPEC_DIR }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/provider-profile/race.json"
          mkdir -p "$(dirname "$profile")"
          command=(scripts/go-retry.sh 2 go test -p "$GO_PACKAGE_PARALLELISM" -timeout=30m -v -race ./internal/... ./tools/...)
          if command -v runner-profile >/dev/null 2>&1; then
            runner-profile --name race --output "$profile" --variant "p${GO_PACKAGE_PARALLELISM}" -- "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Upload race-test profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-ci-profile-${{ github.run_id }}-${{ github.run_attempt }}-race
          path: ${{ runner.temp }}/provider-profile
          if-no-files-found: ignore
          retention-days: 30

  lint:
    name: Lint
    if: inputs.run-lint
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'terraform-provider-xcsh-compute' }}
    permissions:
      contents: read
    env:
      GOGC: '20'
      GOMEMLIMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '4GiB' || '16GiB' }}
      GOMAXPROCS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
      GO_PACKAGE_PARALLELISM: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Verify governed runner input
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          RUNNER_LABEL: ${{ inputs.runner-label }}
        run: test "$RUNNER_LABEL" = terraform-provider-xcsh-compute
      - name: Set up Go for fork isolation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false
      - name: Install golangci-lint for fork isolation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2
          install-only: true
      - name: Verify immutable lint toolchain
        run: |
          test "$(go env GOVERSION)" = go1.25.13
          golangci-lint --version | grep -F '2.12.2'
      - name: Restore source-bound Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: provider-go-${{ runner.os }}-${{ runner.arch }}-1.25.13-${{ hashFiles('go.sum') }}
      - name: Run golangci-lint with runner profiling
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(
            go list -f '{{.Dir}}' ./internal/... . ./tools/... |
              grep -vE '/internal/(provider|client)$'
          )
          profile="$RUNNER_TEMP/provider-profile/lint.json"
          mkdir -p "$(dirname "$profile")"
          command=(golangci-lint run --timeout=15m "--concurrency=${GO_PACKAGE_PARALLELISM}" "${pkgs[@]}")
          if command -v runner-profile >/dev/null 2>&1; then
            runner-profile --name lint --output "$profile" --variant "p${GO_PACKAGE_PARALLELISM}" -- "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Upload lint profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-ci-profile-${{ github.run_id }}-${{ github.run_attempt }}-lint
          path: ${{ runner.temp }}/provider-profile
          if-no-files-found: ignore
          retention-days: 30

  aggregate:
    name: Build and Test
    needs: [build, vet, race, lint]
    if: always()
    runs-on: managed-socketless
    permissions: {}
    outputs:
      success: ${{ steps.result.outputs.success }}
    steps:
      - name: Preserve aggregate required-check semantics
        id: result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          RACE_RESULT: ${{ needs.race.result }}
          RUN_LINT: ${{ inputs.run-lint }}
          VET_RESULT: ${{ needs.vet.result }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" = success ] &&
             [ "$VET_RESULT" = success ] &&
             [ "$RACE_RESULT" = success ] &&
             { [ "$RUN_LINT" != true ] || [ "$LINT_RESULT" = success ]; }; then
            echo 'success=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'success=false' >> "$GITHUB_OUTPUT"
          echo "::error::build=${BUILD_RESULT} vet=${VET_RESULT} race=${RACE_RESULT} lint=${LINT_RESULT}"
          exit 1
