# Reusable workflow for generating Terraform provider documentation
# Called by: on-merge.yml, sync-openapi.yml
name: Generate Documentation

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        type: string
        default: ''
    outputs:
      changed:
        description: 'Whether documentation changed'
        value: ${{ jobs.generate.outputs.changed }}

# Do not inherit a write-capable caller token into this read-only generator.
permissions: {}

jobs:
  generate:
    name: Generate Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout and download the public API-spec release
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # This job had no spec download at all, so transform-docs.go always stripped
      # the spec-derived enrichment and the "Check for changes" step below always
      # saw a dirty tree. Its `changed` output gates create-regeneration-pr in
      # on-merge.yml, so every qualifying push opened a regeneration PR for a diff
      # that only existed because the bundle was missing.
      - name: Download API specs
        uses: ./.github/actions/download-api-specs
        with:
          token: ${{ github.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Install tfplugindocs
        run: |
          # Retry logic for go install (network-dependent)
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "::group::Install tfplugindocs - Attempt $attempt of $max_attempts"
            if GOTOOLCHAIN=auto go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            attempt=$((attempt + 1))
            if [ $attempt -le $max_attempts ]; then
              sleep_time=$((2 ** attempt * 5))
              echo "::warning::go install failed, retrying in ${sleep_time}s..."
              sleep $sleep_time
            fi
          done
          if [ $attempt -gt $max_attempts ]; then
            echo "::error::Failed to install tfplugindocs after $max_attempts attempts"
            exit 1
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Generate and validate all provider documentation
        run: scripts/generate-provider-docs.sh

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain docs/ examples/ templates/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Documentation changes detected:"
            git status --porcelain docs/ examples/ templates/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No documentation changes"
          fi
