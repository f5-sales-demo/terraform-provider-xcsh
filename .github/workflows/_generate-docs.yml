# Reusable workflow for generating Terraform provider documentation
# Called by: on-merge.yml, sync-openapi.yml
name: Generate Documentation

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        type: string
        default: ''
    outputs:
      changed:
        description: 'Whether documentation changed'
        value: ${{ jobs.generate.outputs.changed }}

# Do not inherit a write-capable caller token into this read-only generator.
permissions: {}

jobs:
  generate:
    name: Generate Documentation
    runs-on: managed-socketless
    permissions:
      contents: read # checkout and download the public API-spec release
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # This job had no spec download at all, so transform-docs.go always stripped
      # the spec-derived enrichment and the "Check for changes" step below always
      # saw a dirty tree. Its `changed` output gates create-regeneration-pr in
      # on-merge.yml, so every qualifying push opened a regeneration PR for a diff
      # that only existed because the bundle was missing.
      - name: Download API specs
        uses: ./.github/actions/download-api-specs
        with:
          token: ${{ github.token }}

      - name: Verify immutable Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.25.13

      - name: Verify image-resident tfplugindocs
        run: |
          go version -m "$(command -v tfplugindocs)" | grep -F "mod github.com/hashicorp/terraform-plugin-docs v0.25.0"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Generate and validate all provider documentation
        run: scripts/generate-provider-docs.sh

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain docs/ examples/ templates/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Documentation changes detected:"
            git status --porcelain docs/ examples/ templates/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No documentation changes"
          fi
