# Reusable read-only workflow for regenerating provider code from OpenAPI specs.
name: Generate Provider Code

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable Git ref to check out
        type: string
        default: ''
      spec-dir:
        description: Directory containing OpenAPI specs
        type: string
        default: docs/specifications/api
      runner-label:
        description: Trusted runner label for heavy Go work
        type: string
        default: terraform-provider-xcsh-compute
      go-concurrency:
        description: Go package and process concurrency on the compute pool
        type: number
        default: 4
    outputs:
      generation-artifact-name:
        description: Source-bound provider generation artifact
        value: ${{ jobs.generate.outputs.generation-artifact-name }}
      source-sha:
        description: Exact source commit used for generation
        value: ${{ jobs.generate.outputs.source-sha }}
      digest:
        description: SHA-256 digest of the binary provider patch
        value: ${{ jobs.generate.outputs.digest }}
      changed:
        description: Whether provider code changed
        value: ${{ jobs.generate.outputs.changed }}

permissions: {}

jobs:
  generate:
    name: Generate Provider Code
    runs-on: terraform-provider-xcsh-compute
    permissions:
      contents: read
    outputs:
      generation-artifact-name: ${{ steps.artifact.outputs.artifact_name }}
      source-sha: ${{ steps.artifact.outputs.source_sha }}
      digest: ${{ steps.artifact.outputs.digest }}
      changed: ${{ steps.artifact.outputs.changed }}
    env:
      GOGC: '20'
      GOMEMLIMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '4GiB' || '16GiB' }}
      GOMAXPROCS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
      GO_PACKAGE_PARALLELISM: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 1 || inputs.go-concurrency }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify governed runner input
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          RUNNER_LABEL: ${{ inputs.runner-label }}
        run: test "$RUNNER_LABEL" = terraform-provider-xcsh-compute
      - name: Download API specs
        uses: ./.github/actions/download-api-specs
        with:
          token: ${{ github.token }}
          spec-dir: ${{ inputs.spec-dir }}
      - name: Verify immutable Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = go1.25.13
      - name: Restore source-bound Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: provider-go-${{ runner.os }}-${{ runner.arch }}-1.25.13-${{ hashFiles('go.sum') }}
      - name: Run code generator with runner profiling
        env:
          SPEC_DIR: ${{ inputs.spec-dir }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/provider-profile/generation.json"
          mkdir -p "$(dirname "$profile")"
          command=(go run -p "$GO_PACKAGE_PARALLELISM" tools/generate-all-schemas.go "--spec-dir=$SPEC_DIR")
          if command -v runner-profile >/dev/null 2>&1; then
            runner-profile --name provider-generation --output "$profile" --variant "p${GO_PACKAGE_PARALLELISM}" -- "${command[@]}"
          else
            "${command[@]}"
          fi
          scripts/go-retry.sh 3 go mod tidy
      - name: Build regenerated tree with runner profiling
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/provider-profile/build.json"
          command=(scripts/go-retry.sh 3 go build -p "$GO_PACKAGE_PARALLELISM" -gcflags='all=-N -l' -v ./...)
          if command -v runner-profile >/dev/null 2>&1; then
            runner-profile --name provider-build --output "$profile" --variant "p${GO_PACKAGE_PARALLELISM}" -- "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Vet regenerated tree with runner profiling
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/provider-profile/vet.json"
          command=(scripts/go-retry.sh 3 go vet -p "$GO_PACKAGE_PARALLELISM" ./...)
          if command -v runner-profile >/dev/null 2>&1; then
            runner-profile --name provider-vet --output "$profile" --variant "p${GO_PACKAGE_PARALLELISM}" -- "${command[@]}"
          else
            "${command[@]}"
          fi
          scripts/vet-build-ignored-tools.sh
      - name: Test regenerated tree with runner profiling
        env:
          XCSH_SPEC_DIR: ${{ inputs.spec-dir }}
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/provider-profile/test.json"
          command=(scripts/go-retry.sh 2 go test -p "$GO_PACKAGE_PARALLELISM" -gcflags='all=-N -l' -v ./internal/... ./tools/...)
          if command -v runner-profile >/dev/null 2>&1; then
            runner-profile --name provider-test --output "$profile" --variant "p${GO_PACKAGE_PARALLELISM}" -- "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Create source-bound provider patch
        id: artifact
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/provider-generation"
          patch="$artifact_dir/provider-generation.patch"
          manifest="$artifact_dir/generation-manifest.json"
          mkdir -p "$artifact_dir"
          source_sha=$(git rev-parse HEAD)
          git add -A
          git diff --cached --binary --full-index --no-ext-diff >"$patch"
          changed=false
          if [ -s "$patch" ]; then
            changed=true
            git diff --cached --stat
          fi
          git reset
          digest="sha256:$(sha256sum <"$patch" | awk '{print $1}')"
          go_version=$(go env GOVERSION)
          jq_args=(--arg artifact_kind provider --arg source_sha "$source_sha")
          jq_args+=(--arg patch_file provider-generation.patch --arg patch_sha256 "$digest")
          jq_args+=(--arg go_version "$go_version" --argjson go_concurrency "$GO_PACKAGE_PARALLELISM")
          jq_args+=(--argjson changed "$changed")
          jq -nS "${jq_args[@]}" '{schema_version:1,artifact_kind:$artifact_kind,source_sha:$source_sha,patch_file:$patch_file,patch_sha256:$patch_sha256,changed:$changed,go_concurrency:$go_concurrency,tool_versions:{go:$go_version}}' >"$manifest"
          artifact_name="provider-generation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "artifact_name=$artifact_name"
            echo "source_sha=$source_sha"
            echo "digest=$digest"
            echo "changed=$changed"
          } >>"$GITHUB_OUTPUT"
      - name: Upload provider generation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/provider-generation
          if-no-files-found: error
          retention-days: 30
      - name: Upload provider workload profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-generation-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-profile
          if-no-files-found: ignore
          retention-days: 30
