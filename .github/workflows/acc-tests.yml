name: Acceptance Tests
on:
  workflow_dispatch:
    inputs:
      mode:
        default: real-only
        type: string
permissions: {}
jobs:
  reproduce:
    runs-on: managed-socketless
    environment: acceptance-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce original schema failures without valid create fixtures
        env:
          XCSH_API_URL: ${{ secrets.XCSH_API_URL }}
          XCSH_API_TOKEN: ${{ secrets.XCSH_API_TOKEN }}
          TF_ACC: '1'
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.25.13
          mkdir -p test-reports
          RAW=$(mktemp)
          chmod 600 "$RAW"
          trap 'rm -f "$RAW"' EXIT
          STATUS=0
          go test -json -p 1 -parallel 1 -count=1 -timeout 30m -run '^(TestAccServicePolicyRuleResource_basic|TestAccBgpDataSource_basic)$' ./internal/provider > "$RAW" 2>&1 || STATUS=$?
          JSON_STATUS=0
          go run tools/test-report/main.go -tenant-safe -format=json -output=test-reports/reproduction.json < "$RAW" || JSON_STATUS=$?
          go run tools/test-report/main.go -tenant-safe -format=markdown -all -output=test-reports/reproduction.md < "$RAW" || true
          test "$STATUS" -ne 0
          test "$JSON_STATUS" -eq 1
          jq -e '.total_tests == 2 and .total_failed == 2 and all(.failed_tests[]; .failure_fingerprint.class == "framework_diagnostic")' test-reports/reproduction.json > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue-2539-reproduction
          path: test-reports/
