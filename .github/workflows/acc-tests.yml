name: Acceptance Readback Diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: managed-socketless
    environment: acceptance-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect exact run ownership without mutation
        env:
          XCSH_API_URL: ${{ secrets.XCSH_API_URL }}
          XCSH_API_TOKEN: ${{ secrets.XCSH_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p test-reports
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,itertools,pathlib
          run="r38332478097a1"
          def get(path):
              request=urllib.request.Request(os.environ["XCSH_API_URL"].rstrip("/")+path,headers={"Authorization":"APIToken "+os.environ["XCSH_API_TOKEN"]})
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as error:
                  try:body=json.loads(error.read())
                  except ValueError:body={}
                  return error.code,body or {}
          receipt=[]
          owned=[]
          for typ,collection in [("xcsh_origin_pool","origin_pools"),("xcsh_service_policy_rule","service_policy_rules")]:
              status,listing=get("/api/config/namespaces/system/"+collection)
              row={"type":typ,"list_status":status,"items_present":isinstance(listing.get("items"),list),"matched":0,"readbacks":[]}
              for item in listing.get("items",[]) or []:
                  metadata=item.get("metadata") or item
                  name=metadata.get("name","")
                  if not name.startswith("tf-acc-test-"+run+"-"):continue
                  row["matched"]+=1
                  code,body=get("/api/config/namespaces/system/"+collection+"/"+name)
                  record={"status":code}
                  for location in ["metadata","system_metadata","replace_form"]:
                      block=body.get(location) or {}
                      record[location+"_present"]=isinstance(block,dict) and bool(block)
                      record[location+"_uid_present"]=bool(block.get("uid")) if isinstance(block,dict) else False
                      record[location+"_name_matches"]=block.get("name")==name if isinstance(block,dict) else False
                      record[location+"_run_matches"]=(block.get("annotations") or {}).get("f5-sales-demo.com/acceptance-run")==run if isinstance(block,dict) else False
                      if location=="replace_form" and isinstance(block,dict):
                          record["replace_metadata_uid_present"]=bool((block.get("metadata") or {}).get("uid"))
                          record["replace_system_uid_present"]=bool((block.get("system_metadata") or {}).get("uid"))
                  row["readbacks"].append(record)
                  if code==200 and (body.get("metadata") or {}).get("annotations",{}).get("f5-sales-demo.com/acceptance-run")==run:
                      owned.append({"type":typ,"namespace":"system","name":name,"status":"intent"})
              receipt.append(row)
          with open("test-reports/readback.json","w") as output:json.dump(receipt,output,indent=2)
          expected="9ac471ed9795a901882f0164625929f220afccb7fe65542e1ac6b3e41e0fd1de"
          private=pathlib.Path(os.environ["RUNNER_TEMP"])/"issue-2539-journal-recovery"
          private.mkdir(mode=0o700,exist_ok=True)
          restored=False
          if len(owned)==2:
              for order in itertools.permutations(owned):
                  data=json.dumps({"version":1,"run_id":run,"resources":list(order)},separators=(",",":")).encode()
                  if hashlib.sha256(data).hexdigest()==expected:
                      journal=private/"ownership.json"
                      journal.write_bytes(data)
                      journal.chmod(0o600)
                      restored=True
                      break
          with open("test-reports/journal-recovery.json","w") as output:json.dump({"version":1,"original_digest_matches":restored,"owned_count":len(owned)},output)
          if not restored:raise SystemExit("Original journal digest could not be restored; deletion prohibited.")
          PY
          go run ./tools/acceptance-ownership -mode=cleanup \
            -journal="$RUNNER_TEMP/issue-2539-journal-recovery/ownership.json" \
            -run-id=r38332478097a1 -receipt=test-reports/recovered-cleanup.json
          python3 - <<'PY'
          # The journal is private; only its structured cleanup receipt is uploaded.
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: issue-2539-readback
          path: test-reports/
