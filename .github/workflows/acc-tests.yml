# Acceptance Tests Workflow
#
# Comprehensive acceptance tests for the F5 XC Terraform Provider.
# It supports both mock tests (fast, parallel) and real API tests, plus behavioral
# consistency comparison between mock and real API results.
#
# Triggers:
#   - Manual dispatch with mode and runner selection
#   - Pull requests (mock tests only for safety)
#   - Weekly scheduled run (full suite)
#
# Test Modes:
#   - mock-only: Parallel mock tests, runs on ubuntu-latest
#   - real-only: Sequential real API tests
#   - full: Mock tests first, then real API tests, then comparison
#   - pr-subset: Mock tests only (safe for PRs)
#
# Comparison Feature:
#   When both mock and real tests run, the workflow compares results to ensure
#   the mock server behaves identically to the real F5 XC API. Any discrepancies
#   indicate the mock server needs fixes (tests that pass on real but fail on mock).
#
# Runner Options:
#   - self-hosted: Docker-based runner for VPN-only API access (default)
#   - ubuntu-latest: Standard GitHub runner for public API access
#
# Required Secrets for Real API Tests:
#     - XCSH_API_URL: F5 XC Console API URL (e.g., https://tenant.console.ves.volterra.io)
#     - XCSH_API_TOKEN: API token from F5 XC Console
#
# IMPORTANT: Real API tests require self-hosted runner with network access
# to the F5 XC environment.

name: Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode'
        required: true
        default: 'full'
        type: choice
        options:
          - mock-only      # Fast, parallel mock tests
          - real-only      # Sequential real API tests (self-hosted)
          - full           # Both mock and real API tests
          - pr-subset      # Mock tests only (safe for PRs)
      parallel:
        description: 'Parallelism for mock tests'
        required: false
        default: '4'
        type: string
      timeout:
        description: 'Timeout per test (minutes)'
        required: false
        default: '10'
        type: string
      runner:
        description: 'Runner type (self-hosted for VPN-only APIs)'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted     # VPN-required API access (default)
          - ubuntu-latest   # Public API access

  pull_request:
    branches: [main]
    paths:
      - 'internal/provider/**'
      - 'internal/client/**'
      - 'internal/acctest/**'
      - 'internal/functions/**'
      - 'internal/blindfold/**'

  # Weekly full test run
  schedule:
    - cron: '0 2 * * 1'  # Monday 2 AM UTC

# Deny by default. Jobs that check out source opt into contents:read, and only the
# two JUnit publishers also receive checks:write.
permissions: {}

# Only one acceptance test run at a time
concurrency:
  group: acceptance-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Mock Tests - Run on standard GitHub runners (PARALLEL, no rate limiting)
  # ═══════════════════════════════════════════════════════════════════════════
  mock-tests:
    name: Mock Tests (Parallel)
    runs-on: ubuntu-latest
    # Always run mock tests except for real-only mode
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.mode != 'real-only'

    # Publishes the "Mock Test Results" check run.
    permissions:
      contents: read # checkout the provider and test harness
      checks: write # publish the mikepenz JUnit check run

    outputs:
      mock_passed: ${{ steps.run-tests.outputs.passed }}
      mock_failed: ${{ steps.run-tests.outputs.failed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run mock tests
        id: run-tests
        env:
          # workflow_dispatch inputs are free-text; via env they stay inert data
          # instead of expanding into the run body as shell.
          INPUT_PARALLEL: ${{ github.event.inputs.parallel }}
          INPUT_TIMEOUT: ${{ github.event.inputs.timeout }}
        run: |
          set -o pipefail
          mkdir -p test-reports

          # Mock tests run in PARALLEL - no rate limiting needed
          PARALLEL="${INPUT_PARALLEL:-4}"
          TIMEOUT="${INPUT_TIMEOUT:-10}"

          echo "Running mock tests with parallelism: $PARALLEL"

          # Run mock tests and capture output
          # Note: TF_ACC=1 is required for resource.Test() even with mock server
          # XCSH_MOCK_MODE=1 ensures mock server is used instead of real API
          # Tests include both provider resources AND provider-defined functions
          TEST_STATUS=0
          TF_ACC=1 XCSH_MOCK_MODE=1 go test -json \
            -parallel "$PARALLEL" \
            -timeout "${TIMEOUT}m" \
            -run 'TestMock.*' \
            ./internal/provider/... ./internal/functions/... \
            2>&1 | tee test-reports/test-output-mock.json || TEST_STATUS=${PIPESTATUS[0]}

          JSON_REPORT_STATUS=0
          cat test-reports/test-output-mock.json | go run tools/test-report/main.go \
            -format=json -output=test-reports/mock-tests.json || JSON_REPORT_STATUS=$?
          jq -e '.total_passed | numbers' test-reports/mock-tests.json >/dev/null || {
            echo "::error::Mock JSON report was not generated completely"
            exit 1
          }

          # Extract metrics for outputs
          PASSED=$(jq -r '.total_passed // 0' test-reports/mock-tests.json)
          FAILED=$(jq -r '.total_failed // 0' test-reports/mock-tests.json)

          EXPECTED_REPORT_STATUS=0
          if [[ "$FAILED" -ne 0 ]]; then EXPECTED_REPORT_STATUS=1; fi
          if [[ "$JSON_REPORT_STATUS" -ne "$EXPECTED_REPORT_STATUS" ]]; then
            echo "::error::Mock JSON reporter exit disagrees with its measured failures"
            exit 1
          fi

          JUNIT_REPORT_STATUS=0
          cat test-reports/test-output-mock.json | go run tools/test-report/main.go \
            -format=junit -output=test-reports/mock-tests.xml || JUNIT_REPORT_STATUS=$?
          MARKDOWN_REPORT_STATUS=0
          cat test-reports/test-output-mock.json | go run tools/test-report/main.go \
            -format=markdown -all -output=test-reports/mock-tests.md || MARKDOWN_REPORT_STATUS=$?
          if [[ ! -s test-reports/mock-tests.xml || ! -s test-reports/mock-tests.md ||
                "$JUNIT_REPORT_STATUS" -ne "$EXPECTED_REPORT_STATUS" ||
                "$MARKDOWN_REPORT_STATUS" -ne "$EXPECTED_REPORT_STATUS" ]]; then
            echo "::error::Mock evidence generation was incomplete or inconsistent"
            exit 1
          fi

          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

          if [[ "$TEST_STATUS" -ne 0 || "$FAILED" -ne 0 ]]; then
            echo "::error::Mock tests failed (go test exit ${TEST_STATUS}; ${FAILED} reported failures)"
            exit 1
          fi

      - name: Upload mock test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mock-test-reports
          path: test-reports/
          retention-days: 30

      - name: Publish JUnit Results
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        if: always()
        with:
          report_paths: 'test-reports/mock-tests.xml'
          check_name: 'Mock Test Results'
          fail_on_failure: false

  # ═══════════════════════════════════════════════════════════════════════════
  # Real API Tests - SEQUENTIAL with rate limiting
  # Use self-hosted for VPN-only APIs, ubuntu-latest for public APIs
  # ═══════════════════════════════════════════════════════════════════════════
  real-api-tests:
    name: Real API Tests (Sequential)
    # Runner selection: self-hosted (VPN-required, default) or ubuntu-latest (public)
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}
    needs: [mock-tests]
    # Run only when the selected mode's prerequisite state is exact. The
    # explicit always() is required for real-only: its mock prerequisite is
    # intentionally skipped, which must not suppress the real API job.
    if: |
      always() &&
      ((github.event_name == 'schedule' &&
        needs.mock-tests.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.mode == 'full' &&
        needs.mock-tests.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.mode == 'real-only' &&
        needs.mock-tests.result == 'skipped'))
    # Publishes the "Real API Test Results" check run.
    permissions:
      contents: read # checkout the provider and test harness
      checks: write # publish the mikepenz JUnit check run

    outputs:
      real_passed: ${{ steps.run-tests.outputs.passed }}
      real_failed: ${{ steps.run-tests.outputs.failed }}
      transient_errors: ${{ steps.run-tests.outputs.transient }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify API credentials
        id: verify-creds
        env:
          XCSH_API_URL: ${{ secrets.XCSH_API_URL }}
          XCSH_API_TOKEN: ${{ secrets.XCSH_API_TOKEN }}
        run: |
          echo "Checking API credentials..."

          if [ -z "$XCSH_API_URL" ]; then
            echo "::error::XCSH_API_URL secret not configured"
            exit 1
          fi
          echo "✓ API URL is configured"

          if [ -z "$XCSH_API_TOKEN" ]; then
            echo "::error::XCSH_API_TOKEN secret not configured"
            exit 1
          fi
          echo "✓ API token is configured"

      - name: Run real API tests
        id: run-tests
        env:
          XCSH_API_URL: ${{ secrets.XCSH_API_URL }}
          XCSH_API_TOKEN: ${{ secrets.XCSH_API_TOKEN }}
          TF_ACC: '1'
          # See the mock-tests job: dispatch inputs and step outputs are passed as
          # env so they cannot expand into the run body as shell.
          INPUT_TIMEOUT: ${{ github.event.inputs.timeout }}
        run: |
          set -o pipefail
          mkdir -p test-reports

          TIMEOUT="${INPUT_TIMEOUT:-10}"

          echo "Running real API tests SEQUENTIALLY with rate limiting"
          echo "Timeout per test: ${TIMEOUT}m"

          # Real API tests run SEQUENTIALLY (-parallel 1) with rate limiting
          # Tests include both provider resources AND provider-defined functions
          TEST_STATUS=0
          go test -json \
            -parallel 1 \
            -timeout "${TIMEOUT}m" \
            -run 'TestAcc.*' \
            ./internal/provider/... ./internal/functions/... \
            > test-reports/test-output-real.json 2>&1 || TEST_STATUS=$?

          # Never emit the raw live-tenant stream to logs or artifacts.
          JSON_REPORT_STATUS=0
          cat test-reports/test-output-real.json | go run tools/test-report/main.go \
            -format=json -output=test-reports/real-tests.json || JSON_REPORT_STATUS=$?
          jq -e '.total_passed | numbers' test-reports/real-tests.json >/dev/null || {
            echo "::error::Real API JSON report was not generated completely"
            exit 1
          }

          PASSED=$(jq -r '.total_passed // 0' test-reports/real-tests.json)
          FAILED=$(jq -r '.total_failed // 0' test-reports/real-tests.json)
          TRANSIENT=$(jq -r '[.transient_errors[]?.count // 0] | add // 0' test-reports/real-tests.json)
          EXPECTED_REPORT_STATUS=0
          if [[ "$FAILED" -ne 0 ]]; then EXPECTED_REPORT_STATUS=1; fi
          if [[ "$JSON_REPORT_STATUS" -ne "$EXPECTED_REPORT_STATUS" ]]; then
            echo "::error::Real API JSON reporter exit disagrees with its measured failures"
            exit 1
          fi

          MARKDOWN_REPORT_STATUS=0
          cat test-reports/test-output-real.json | go run tools/test-report/main.go \
            -format=markdown -all -output=test-reports/real-tests.md || MARKDOWN_REPORT_STATUS=$?
          if [[ ! -s test-reports/real-tests.md ||
                "$MARKDOWN_REPORT_STATUS" -ne "$EXPECTED_REPORT_STATUS" ]]; then
            echo "::error::Real API markdown evidence generation was incomplete or inconsistent"
            exit 1
          fi

          # The markdown report contains aggregates/test names, and failure_output
          # is removed recursively from JSON evidence before publication.
          jq 'walk(if type == "object" then del(.failure_output) else . end)' \
            test-reports/real-tests.json > test-reports/real-tests-sanitized.json
          mv test-reports/real-tests-sanitized.json test-reports/real-tests.json
          rm -f test-reports/test-output-real.json

          {
            echo "passed=$PASSED"
            echo "failed=$FAILED"
            echo "transient=$TRANSIENT"
          } >> "$GITHUB_OUTPUT"

          if [[ "$TEST_STATUS" -ne 0 || "$FAILED" -ne 0 ]]; then
            echo "::error::Real API tests failed (go test exit ${TEST_STATUS}; ${FAILED} reported failures)"
            exit 1
          fi

      - name: Upload real API test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: real-api-test-reports
          path: |
            test-reports/real-tests.json
            test-reports/real-tests.md
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Resource Cleanup - Run sweepers to clean up test resources (even on failure)
  # ═══════════════════════════════════════════════════════════════════════════
  cleanup:
    name: Cleanup Test Resources
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}
    needs: [real-api-tests]
    # ALWAYS run after real API tests, even if they failed
    if: |
      always() &&
      needs.real-api-tests.result != 'skipped'
    permissions:
      contents: read # checkout the provider sweepers

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run sweepers
        id: sweep
        env:
          XCSH_API_URL: ${{ secrets.XCSH_API_URL }}
          XCSH_API_TOKEN: ${{ secrets.XCSH_API_TOKEN }}
          TF_ACC: '1'
        run: |
          set -o pipefail
          [ -n "$XCSH_API_URL" ] || { echo "::error::XCSH_API_URL secret not configured"; exit 1; }
          [ -n "$XCSH_API_TOKEN" ] || { echo "::error::XCSH_API_TOKEN secret not configured"; exit 1; }
          echo "Running sweepers to clean up test resources..."
          echo ""

          # Run all sweepers to clean up leftover test resources
          # This runs even if tests failed to ensure cleanup
          go test ./internal/acctest -v -sweep=all -timeout 30m \
            > sweep-output.txt 2>&1 || SWEEP_EXIT=$?

          # Count swept resources (for summary)
          NAMESPACE_COUNT=$(grep -c "Successfully deleted namespace" sweep-output.txt || echo "0")
          echo "swept_namespaces=$NAMESPACE_COUNT" >> "$GITHUB_OUTPUT"

          # Report results
          echo ""
          echo "Sweep completed."
          echo "Namespaces cleaned: $NAMESPACE_COUNT"

          # Absence is idempotent success; any non-zero sweeper result is a defect.
          if [[ "${SWEEP_EXIT:-0}" -ne 0 ]]; then
            echo "::error::One or more sweepers failed"
            exit 1
          fi

      - name: Post cleanup summary
        env:
          SWEPT_NAMESPACES: ${{ steps.sweep.outputs.swept_namespaces || '0' }}
        run: |
          {
            echo "## Resource Cleanup"
            echo ""
            echo "Sweepers ran to clean up test resources left behind by acceptance tests."
            echo ""
            echo "- Namespaces cleaned: ${SWEPT_NAMESPACES}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # Mock vs Real Comparison - Ensures mock server behavioral consistency
  # ═══════════════════════════════════════════════════════════════════════════
  compare-results:
    name: Compare Mock vs Real
    runs-on: ubuntu-latest
    needs: [mock-tests, real-api-tests]
    # Only run when both mock and real tests have completed
    if: |
      always() &&
      needs.mock-tests.result == 'success' &&
      needs.real-api-tests.result == 'success'
    permissions:
      contents: read # checkout the comparison tooling

    outputs:
      mock_consistent: ${{ steps.compare.outputs.consistent }}
      mock_needs_fix: ${{ steps.compare.outputs.needs_fix }}
      comparison_available: ${{ steps.compare.outputs.available }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download mock test reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mock-test-reports
          path: mock-reports/

      - name: Download real API test reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: real-api-test-reports
          path: real-reports/

      - name: Run comparison
        id: compare
        run: |
          mkdir -p comparison-reports

          if [[ ! -f "mock-reports/mock-tests.json" ]]; then
            echo "::error::Mock test JSON evidence is missing"
            exit 1
          fi

          if [[ ! -f "real-reports/real-tests.json" ]]; then
            echo "::error::Real API test JSON evidence is missing"
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

          # Run the comparison tool
          COMPARE_EXIT=0
          go run tools/compare-test-results/main.go \
            -mock=mock-reports/mock-tests.json \
            -real=real-reports/real-tests.json \
            -format=markdown \
            -output=comparison-reports/comparison.md || COMPARE_EXIT=$?

          # Also generate JSON format for downstream processing
          JSON_COMPARE_EXIT=0
          go run tools/compare-test-results/main.go \
            -mock=mock-reports/mock-tests.json \
            -real=real-reports/real-tests.json \
            -format=json \
            -output=comparison-reports/comparison.json || JSON_COMPARE_EXIT=$?

          # Extract metrics from JSON comparison
          if [[ -f "comparison-reports/comparison.json" ]]; then
            CONSISTENT=$(jq -r '.summary.consistent // 0' comparison-reports/comparison.json)
            NEEDS_FIX=$(jq -r '.summary.mock_needs_fix // 0' comparison-reports/comparison.json)
            {
              echo "consistent=$CONSISTENT"
              echo "needs_fix=$NEEDS_FIX"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "consistent=0"
              echo "needs_fix=0"
            } >> "$GITHUB_OUTPUT"
          fi

          # A mock/real discrepancy is a production defect, not an advisory.
          if [[ "$COMPARE_EXIT" -ne 0 || "$JSON_COMPARE_EXIT" -ne 0 ]]; then
            echo "::error::Mock server has discrepancies with real API or comparison generation failed"
            exit 1
          fi

      - name: Upload comparison reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.compare.outputs.available == 'true'
        with:
          name: comparison-reports
          path: comparison-reports/
          retention-days: 30

      - name: Post comparison to step summary
        if: always() && steps.compare.outputs.available == 'true'
        run: |
          {
            echo "## Mock vs Real API Comparison"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f "comparison-reports/comparison.md" ]]; then
            cat "comparison-reports/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Comparison report not generated" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Summary Job - Aggregates results and posts to GitHub
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [mock-tests, real-api-tests, compare-results, cleanup]
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-reports/

      - name: Generate summary
        if: always()
        env:
          MOCK_TESTS_RESULT: ${{ needs.mock-tests.result }}
          MOCK_PASSED: ${{ needs.mock-tests.outputs.mock_passed || 'N/A' }}
          MOCK_FAILED: ${{ needs.mock-tests.outputs.mock_failed || 'N/A' }}
          REAL_TESTS_RESULT: ${{ needs.real-api-tests.result }}
          REAL_PASSED: ${{ needs.real-api-tests.outputs.real_passed || 'N/A' }}
          REAL_FAILED: ${{ needs.real-api-tests.outputs.real_failed || 'N/A' }}
          REAL_TRANSIENT: ${{ needs.real-api-tests.outputs.transient_errors || '0' }}
          COMPARE_RESULT: ${{ needs.compare-results.result }}
          COMPARE_AVAILABLE: ${{ needs.compare-results.outputs.comparison_available }}
          COMPARE_CONSISTENT: ${{ needs.compare-results.outputs.mock_consistent || 0 }}
          COMPARE_NEEDS_FIX: ${{ needs.compare-results.outputs.mock_needs_fix || 0 }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_MODE: ${{ github.event.inputs.mode || (github.event_name == 'pull_request' && 'pr-subset') || 'full' }}
        run: |
          {
            echo "## Acceptance Test Results"
            echo ""
            echo "**Workflow Run:** [#${RUN_NUMBER}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})"
            echo "**Triggered by:** ${EVENT_NAME}"
            echo "**Mode:** ${TEST_MODE}"
            echo ""

            # Mock test results
            echo "### Mock Tests (Parallel)"
            if [[ "$MOCK_TESTS_RESULT" == "success" ]]; then
              echo "- Status: ✅ Completed"
              echo "- Passed: ${MOCK_PASSED}"
              echo "- Failed: ${MOCK_FAILED}"
            elif [[ "$MOCK_TESTS_RESULT" == "skipped" ]]; then
              echo "- Status: ⏭️ Skipped"
            else
              echo "- Status: ❌ Failed"
            fi
            echo ""

            # Real API test results
            echo "### Real API Tests (Sequential)"
            if [[ "$REAL_TESTS_RESULT" == "success" ]]; then
              echo "- Status: ✅ Completed"
              echo "- Passed: ${REAL_PASSED}"
              echo "- Failed: ${REAL_FAILED}"
              echo "- Transient Errors: ${REAL_TRANSIENT}"
            elif [[ "$REAL_TESTS_RESULT" == "skipped" ]]; then
              echo "- Status: ⏭️ Skipped (PR mode or mock-only)"
            else
              echo "- Status: ❌ Failed or runner unavailable"
            fi
            echo ""

            # Mock vs Real comparison results
            echo "### Mock vs Real Comparison"
            if [[ "$COMPARE_RESULT" == "success" ]]; then
              if [[ "$COMPARE_AVAILABLE" == "true" ]]; then
                echo "- Status: ✅ Comparison completed"
                echo "- Mock Consistent: ${COMPARE_CONSISTENT} tests"
                if [[ "$COMPARE_NEEDS_FIX" -gt 0 ]]; then
                  echo "- ⚠️ Mock Needs Fix: ${COMPARE_NEEDS_FIX} tests"
                else
                  echo "- Mock Needs Fix: 0 tests ✅"
                fi
              else
                echo "- Status: ⚠️ Reports not available for comparison"
              fi
            elif [[ "$COMPARE_RESULT" == "skipped" ]]; then
              echo "- Status: ⏭️ Skipped (requires both mock and real tests)"
            else
              echo "- Status: ❌ Comparison failed"
            fi
            echo ""

            # Resource cleanup results
            echo "### Resource Cleanup"
            if [[ "$CLEANUP_RESULT" == "success" ]]; then
              echo "- Status: ✅ Cleanup completed"
              echo "- Sweepers ran after tests to clean up leftover resources"
            elif [[ "$CLEANUP_RESULT" == "skipped" ]]; then
              echo "- Status: ⏭️ Skipped (real API tests did not run)"
            else
              echo "- Status: ⚠️ Cleanup had issues (check logs)"
            fi
            echo ""

            # Include markdown report if available
            if [[ -f "all-reports/mock-test-reports/mock-tests.md" ]]; then
              echo "### Detailed Mock Test Report"
              cat "all-reports/mock-test-reports/mock-tests.md"
            fi

            if [[ -f "all-reports/real-api-test-reports/real-tests.md" ]]; then
              echo "### Detailed Real API Test Report"
              cat "all-reports/real-api-test-reports/real-tests.md"
            fi

            if [[ -f "all-reports/comparison-reports/comparison.md" ]]; then
              echo "### Detailed Mock vs Real Comparison Report"
              cat "all-reports/comparison-reports/comparison.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check overall status
        if: always()
        env:
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          COMPARE_RESULT: ${{ needs.compare-results.result }}
          EVENT_NAME: ${{ github.event_name }}
          MOCK_RESULT: ${{ needs.mock-tests.result }}
          REAL_RESULT: ${{ needs.real-api-tests.result }}
          TEST_MODE: ${{ github.event.inputs.mode || (github.event_name == 'pull_request' && 'pr-subset') || 'full' }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}:${TEST_MODE}" in
            pull_request:pr-subset|workflow_dispatch:mock-only|workflow_dispatch:pr-subset)
              EXPECTED_MOCK=success
              EXPECTED_REAL=skipped
              EXPECTED_COMPARE=skipped
              EXPECTED_CLEANUP=skipped
              ;;
            workflow_dispatch:real-only)
              EXPECTED_MOCK=skipped
              EXPECTED_REAL=success
              EXPECTED_COMPARE=skipped
              EXPECTED_CLEANUP=success
              ;;
            schedule:full|workflow_dispatch:full)
              EXPECTED_MOCK=success
              EXPECTED_REAL=success
              EXPECTED_COMPARE=success
              EXPECTED_CLEANUP=success
              ;;
            *)
              echo "::error::Unsupported acceptance-test event/mode: ${EVENT_NAME}:${TEST_MODE}"
              exit 1
              ;;
          esac

          require_result() {
            local job=$1 actual=$2 expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::${job} result was ${actual}; expected ${expected} for ${EVENT_NAME}:${TEST_MODE}"
              exit 1
            fi
          }
          require_result "Mock tests" "$MOCK_RESULT" "$EXPECTED_MOCK"
          require_result "Real API tests" "$REAL_RESULT" "$EXPECTED_REAL"
          require_result "Mock/real comparison" "$COMPARE_RESULT" "$EXPECTED_COMPARE"
          require_result "Resource cleanup" "$CLEANUP_RESULT" "$EXPECTED_CLEANUP"

          require_evidence() {
            local evidence=$1
            if [[ ! -s "$evidence" ]]; then
              echo "::error::Required acceptance-test evidence is missing: ${evidence}"
              exit 1
            fi
          }
          if [[ "$EXPECTED_MOCK" == success ]]; then
            require_evidence all-reports/mock-test-reports/mock-tests.json
            require_evidence all-reports/mock-test-reports/mock-tests.xml
            require_evidence all-reports/mock-test-reports/mock-tests.md
            jq -e '
              (.total_passed | type == "number") and
              (.total_failed | type == "number")
            ' all-reports/mock-test-reports/mock-tests.json >/dev/null || {
              echo "::error::Mock test JSON evidence is malformed"
              exit 1
            }
            python3 -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' \
              all-reports/mock-test-reports/mock-tests.xml || {
              echo "::error::Mock test XML evidence is malformed"
              exit 1
            }
          fi
          if [[ "$EXPECTED_REAL" == success ]]; then
            require_evidence all-reports/real-api-test-reports/real-tests.json
            require_evidence all-reports/real-api-test-reports/real-tests.md
            jq -e '
              (.total_passed | type == "number") and
              (.total_failed | type == "number") and
              ([.. | objects | has("failure_output")] | all(. == false))
            ' all-reports/real-api-test-reports/real-tests.json >/dev/null || {
              echo "::error::Real API JSON evidence is malformed or unsanitized"
              exit 1
            }
          fi
          if [[ "$EXPECTED_COMPARE" == success ]]; then
            require_evidence all-reports/comparison-reports/comparison.json
            require_evidence all-reports/comparison-reports/comparison.md
            jq -e '
              (.summary.consistent | type == "number") and
              (.summary.mock_needs_fix | type == "number")
            ' all-reports/comparison-reports/comparison.json >/dev/null || {
              echo "::error::Mock/real comparison JSON evidence is malformed"
              exit 1
            }
          fi

          echo "All required tests passed!"

      - name: Notify on scheduled failure
        if: |
          always() &&
          github.event_name == 'schedule' &&
          (needs.mock-tests.result != 'success' ||
           needs.real-api-tests.result != 'success' ||
           needs.compare-results.result != 'success' ||
           needs.cleanup.result != 'success')
        run: |
          echo "::warning::Scheduled test run had failures"
          echo "Check the workflow run for details."
          # Future: Add Slack/email notification here
