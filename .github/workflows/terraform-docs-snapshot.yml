name: Publish Terraform Documentation Snapshot

on:
  workflow_call:
    inputs:
      provider_tag:
        description: Exact published stable provider version
        required: true
        type: string
    secrets:
      REPO_SYNC_TOKEN:
        description: Read repository immutable-release policy
        required: true
  workflow_dispatch:
    inputs:
      provider_tag:
        description: Published stable provider version (empty selects newest)
        required: false
        type: string
  schedule:
    - cron: '17 8 * * *'

permissions: {}

concurrency:
  group: terraform-documentation-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable Terraform documentation
    runs-on: managed-socketless
    environment: terraform-documentation-publication
    permissions:
      contents: write # create immutable snapshot release and upload assets
    steps:
      - name: Checkout publisher and exact provider tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish canonical snapshot without rebuilding schemas
        env:
          # The integration token can be read-only for release writes in both
          # direct and nested calls. Use the governed repository credential.
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          POLICY_READ_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }} # administration permission for immutable-policy read only
          PROVIDER_TAG: ${{ inputs.provider_tag }}
        run: |
          set -euo pipefail
          args=(--publish --output "$RUNNER_TEMP/terraform-documentation")
          if [ -n "$PROVIDER_TAG" ]; then
            args+=(--tag "$PROVIDER_TAG")
          fi
          python3 scripts/terraform_docs_snapshot.py "${args[@]}"
