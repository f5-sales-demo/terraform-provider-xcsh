# Workflow for API Default Discovery (Issue #327)
#
# This workflow discovers API default values by creating minimal resources
# and comparing requests with responses. It requires access to the F5 XC
# staging environment, which is only available via VPN.
#
# IMPORTANT: Uses self-hosted runner with VPN access
# Public GitHub runners cannot access the staging environment.
#
# Triggers:
#   - Manual dispatch (workflow_dispatch) with options
#   - Scheduled monthly refresh (first day of month)
#
# Outputs:
#   - Updated tools/api-defaults.json
#   - Updated internal/mocks/generated_defaults.go
#   - PR with changes (if any)
name: Discover API Defaults

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Discovery mode'
        required: true
        default: 'discover'
        type: choice
        options:
          - discover    # Full discovery of all resources
          - validate    # Validate existing defaults against API
          - single      # Discover single resource
      resource:
        description: 'Resource name (for single mode only)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (no PR creation)'
        required: false
        type: boolean
        default: false

  # Monthly refresh to catch API changes
  schedule:
    - cron: '0 6 1 * *'  # First day of month at 6am UTC

# Deny by default. The discovery job alone can push its generated branch and PR;
# the summary job only writes the step summary and needs no repository scope.
permissions: {}

# Only one discovery run at a time
concurrency:
  group: discover-defaults
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Discovery Job - Requires Self-Hosted Runner with VPN Access
  # ═══════════════════════════════════════════════════════════════════════════
  discover:
    name: Discover API Defaults
    environment: default-discovery
    # IMPORTANT: This MUST run on a self-hosted runner with VPN access
    # The staging environment is not accessible from public GitHub runners
    runs-on: [self-hosted, Linux, X64, terraform-provider-xcsh]
    # Checkout, push, and PR creation all use REPO_SYNC_TOKEN explicitly. Keep
    # the automatic GITHUB_TOKEN disabled rather than granting duplicate writes.
    permissions: {}

    outputs:
      changes_detected: ${{ steps.check-changes.outputs.changes_detected }}
      resources_discovered: ${{ steps.discover.outputs.resources_discovered }}
      resources_failed: ${{ steps.discover.outputs.resources_failed }}

    steps:
      - name: Require downstream-triggering token
        env:
          REPO_SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          if [[ -z "$REPO_SYNC_TOKEN" ]]; then
            echo "::error::REPO_SYNC_TOKEN is required for default discovery"
            exit 1
          fi

      - name: Check runner availability
        run: |
          echo "Self-hosted discovery runner started"
          # The self-hosted runner should have VPN configured
          # This step validates we can reach the staging environment

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_SYNC_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify API credentials
        env:
          XCSH_API_URL: ${{ secrets.XCSH_API_URL }}
          XCSH_API_TOKEN: ${{ secrets.XCSH_API_TOKEN }}
        run: |
          echo "Checking API credentials..."
          if [ -z "$XCSH_API_URL" ]; then
            echo "::error::XCSH_API_URL secret not configured"
            echo "Configure repository secrets for API access"
            exit 1
          fi
          echo "API URL is configured"

          if [ -z "$XCSH_API_TOKEN" ]; then
            echo "::error::XCSH_API_TOKEN secret not configured"
            exit 1
          fi
          echo "API token is configured"

      - name: Run discovery
        id: discover
        env:
          XCSH_API_URL: ${{ secrets.XCSH_API_URL }}
          XCSH_API_TOKEN: ${{ secrets.XCSH_API_TOKEN }}
          # `resource` is a free-text workflow_dispatch input, so interpolating it
          # into the run body below would let it expand into executable shell.
          # Both inputs come in as env and are read as inert shell variables.
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RESOURCE: ${{ inputs.resource }}
        run: |
          set -euo pipefail
          MODE="${INPUT_MODE:-discover}"
          RESOURCE="$INPUT_RESOURCE"
          RAW_LOG=discovery-raw.log
          trap 'rm -f "$RAW_LOG"' EXIT

          echo "::group::Running discovery (mode: $MODE)"

          DISCOVERY_EXIT=0
          case "$MODE" in
            discover)
              go run tools/discover-defaults.go -all > "$RAW_LOG" 2>&1 || DISCOVERY_EXIT=$?
              ;;
            validate)
              go run tools/discover-defaults.go -validate > "$RAW_LOG" 2>&1 || DISCOVERY_EXIT=$?
              ;;
            single)
              if [ -z "$RESOURCE" ]; then
                echo "::error::Resource name required for single mode"
                exit 1
              fi
              go run tools/discover-defaults.go -resource="$RESOURCE" > "$RAW_LOG" 2>&1 || DISCOVERY_EXIT=$?
              ;;
            *)
              echo "::error::Unsupported discovery mode"
              exit 1
              ;;
          esac

          echo "::endgroup::"

          # Extract only aggregate evidence. Raw live-tenant output is neither
          # printed nor uploaded and is deleted by the EXIT trap.
          DISCOVERED=$(awk '/^Discovered:[[:space:]]+[0-9]+$/ { value=$2; count++ } END { if (count == 1) print value; else exit 1 }' "$RAW_LOG") || {
            echo "::error::Discovery output did not contain one measured discovered count"
            exit 1
          }
          FAILED=$(awk '/^Failed:[[:space:]]+[0-9]+$/ { value=$2; count++ } END { if (count == 1) print value; else exit 1 }' "$RAW_LOG") || {
            echo "::error::Discovery output did not contain one measured failure count"
            exit 1
          }

          jq -n \
            --argjson discovered "$DISCOVERED" \
            --argjson failed "$FAILED" \
            --argjson tool_exit "$DISCOVERY_EXIT" \
            '{discovered:$discovered,failed:$failed,tool_exit:$tool_exit}' \
            > discovery-evidence.json

          echo "resources_discovered=$DISCOVERED" >> "$GITHUB_OUTPUT"
          echo "resources_failed=$FAILED" >> "$GITHUB_OUTPUT"

          echo "Discovery complete: $DISCOVERED resources discovered, $FAILED failed"
          if [[ "$DISCOVERY_EXIT" -ne 0 || "$FAILED" -ne 0 ]]; then
            echo "::error::Default discovery reported failures"
            exit 1
          fi

      - name: Generate mock fixtures
        if: inputs.mode != 'validate'
        run: |
          echo "::group::Generating mock fixtures"
          go run tools/generate-mock-fixtures.go
          gofmt -s -w internal/mocks/generated_defaults.go
          echo "::endgroup::"

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet tools/api-defaults.json internal/mocks/generated_defaults.go; then
            echo "No changes detected"
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in:"
            git diff --name-only tools/api-defaults.json internal/mocks/generated_defaults.go
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.check-changes.outputs.changes_detected == 'true'
        run: |
          echo "::group::Running mock tests"
          go test -v ./internal/mocks/...
          echo "::endgroup::"

      - name: Create Pull Request
        if: |
          steps.check-changes.outputs.changes_detected == 'true' &&
          inputs.dry_run != true &&
          inputs.mode != 'validate'
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          # Discovery counts reach the commit message and PR body as env rather than
          # as `${{ }}` expansions inside the run body. The PR-body heredoc stays
          # single-quoted because it contains backticks that must not be evaluated,
          # so its values go in by placeholder substitution below.
          RESOURCES_DISCOVERED: ${{ steps.discover.outputs.resources_discovered }}
          RESOURCES_FAILED: ${{ steps.discover.outputs.resources_failed }}
        run: |
          gh auth setup-git

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch
          BRANCH="auto-update/api-defaults-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          # Stage changes
          git add tools/api-defaults.json internal/mocks/generated_defaults.go

          # Commit
          git commit -m "$(cat <<EOF
          chore: update API-discovered defaults

          Automated update from discover-defaults workflow.

          Resources discovered: ${RESOURCES_DISCOVERED}
          Resources failed: ${RESOURCES_FAILED}
          EOF
          )"

          # Push
          git push origin "$BRANCH"

          # Create PR. The heredoc stays single-quoted so the backticks in the body
          # below are not evaluated as command substitution; the two discovery counts
          # are substituted in afterwards instead of being expanded here.
          PR_BODY=$(cat <<'EOF'
          ## Summary

          Automated update of API-discovered default values.

          ## Changes

          - Updated `tools/api-defaults.json` with latest API defaults
          - Regenerated `internal/mocks/generated_defaults.go`

          ## Discovery Results

          - Resources discovered: __RESOURCES_DISCOVERED__
          - Resources failed: __RESOURCES_FAILED__

          ## Testing

          - [x] Mock tests pass with updated fixtures
          EOF
          )
          PR_BODY=${PR_BODY//__RESOURCES_DISCOVERED__/$RESOURCES_DISCOVERED}
          PR_BODY=${PR_BODY//__RESOURCES_FAILED__/$RESOURCES_FAILED}

          gh pr create \
            --title "chore: update API-discovered defaults" \
            --body "$PR_BODY" \
            --label "automated,documentation"

      - name: Upload sanitized discovery evidence
        if: always() && hashFiles('discovery-evidence.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discovery-evidence
          path: discovery-evidence.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Summary Job - Reports results
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: Discovery Summary
    runs-on: ubuntu-latest
    needs: discover
    if: always()
    steps:
      - name: Report results
        env:
          RESOURCES_DISCOVERED: ${{ needs.discover.outputs.resources_discovered || 'N/A' }}
          RESOURCES_FAILED: ${{ needs.discover.outputs.resources_failed || 'N/A' }}
          CHANGES_DETECTED: ${{ needs.discover.outputs.changes_detected || 'N/A' }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
        run: |
          echo "## API Default Discovery Results"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| Resources Discovered | ${RESOURCES_DISCOVERED} |"
          echo "| Resources Failed | ${RESOURCES_FAILED} |"
          echo "| Changes Detected | ${CHANGES_DETECTED} |"
          echo ""

          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "::error::Discovery job did not succeed"
            echo "This may be due to:"
            echo "  - Self-hosted runner unavailable"
            echo "  - VPN connectivity issues"
            echo "  - API credential problems"
          elif [ "$DISCOVER_RESULT" = "skipped" ]; then
            echo "::notice::Discovery job was skipped"
          fi

      - name: Notify on failure (scheduled runs only)
        if: |
          always() &&
          github.event_name == 'schedule' &&
          needs.discover.result != 'success'
        run: |
          echo "::error::Scheduled API default discovery failed"
          echo "Manual intervention may be required."
          # Future: Add Slack/email notification here
